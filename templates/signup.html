<!DOCTYPE html>
<html>

<head>

    <title>Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>
                Sign Up 🚀
            </h1>

            <p>
                Create your Cloud Task Manager account
            </p>

            <form method="POST">

                <input type="text"
                       name="username"
                       placeholder="Create Username"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Create Password"
                       required>

                <button type="submit">
                    Sign Up
                </button>

            </form>

            <div class="auth-links">

                <span>
                    Already have account?
                </span>

                <a href="/login">
                    Login
                </a>

            </div>

        </div>

    </div>

</body>

</html>
